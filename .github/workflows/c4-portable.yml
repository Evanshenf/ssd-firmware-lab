name: c4-portable

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  c41:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install cross and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            gcc-s390x-linux-gnu qemu-user
      - name: Run C4.1 portable and memory-HIF matrix
        run: make -C frontends/headless-c4 check-all

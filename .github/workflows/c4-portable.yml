name: c4-portable

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  c41:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install cross and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            gcc-s390x-linux-gnu libc6-dev-arm64-cross \
            libc6-dev-riscv64-cross libc6-dev-s390x-cross qemu-user
      - name: Run C4.1 portable and memory-HIF matrix
        run: |
          python3 scripts/run_c42_gate.py
          make -C frontends/headless-c4 check-c41 check-clang \
            check-sanitize check-thread check-analysis check-strict \
            check-determinism check-cross

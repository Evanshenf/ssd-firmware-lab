name: current-spine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run current production-spine semantics and bounded storage regressions
        env:
          CC: ${{ matrix.cc }}
        run: sh scripts/check_current_spine.sh

name: current-spine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create a bounded ephemeral test-media mount
        run: |
          test "$(id -u)" -ne 0
          fwlab_ci_media=$(mktemp -d "${RUNNER_TEMP}/fwlab-test-media.XXXXXX")
          printf 'FWLAB_TEST_MEDIA_DIR=%s\n' "$fwlab_ci_media" >> "$GITHUB_ENV"
          sudo mount -t tmpfs -o "size=1G,nodev,nosuid,noexec,uid=$(id -u),gid=$(id -g),mode=0700" \
            tmpfs "$fwlab_ci_media"
      - name: Run current production-spine semantics and bounded storage regressions
        env:
          CC: ${{ matrix.cc }}
        run: /usr/bin/time -v sh scripts/check_current_spine.sh
      - name: Check the explicit x86 SSE4.2 CRC implementation
        env:
          CC: ${{ matrix.cc }}
        # The existing oracle rejects a generic fallback at compile time.
        # This is correctness evidence, not another throughput measurement.
        run: |
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          make -j1 -C frontends/headless-scale -f ftl.mk \
            CC="$CC" BUILD=build/ci-crc-sse42 FWLAB_CRC_NATIVE=0 \
            CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -fno-common -msse4.2 -DFWLAB_TEST_EXPECT_BACKEND=1' \
            check-crc-fast
      - name: Unmount only this job's disposable test medium
        if: always()
        run: |
          if [ -n "${FWLAB_TEST_MEDIA_DIR:-}" ]; then
            if mountpoint -q -- "$FWLAB_TEST_MEDIA_DIR"; then
              sudo umount -- "$FWLAB_TEST_MEDIA_DIR"
            fi
            rmdir -- "$FWLAB_TEST_MEDIA_DIR"
          fi

  lower-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ARM64 userspace tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Run current PAGE2 and physical-media ARM64 userspace fixtures
        # Keep the frozen c4-portable workflow unchanged. These existing small
        # in-process fixtures cover current lower-layer portability, not POSIX
        # persistence, the scaled FTL or native M4/M5. No media mount is needed.
        run: |
          test "$(id -u)" -ne 0
          make -j1 -B -C core/nfc-page-v2 CC=aarch64-linux-gnu-gcc \
            BUILD_DIR=build/ci-aarch64 all
          qemu-aarch64 -L /usr/aarch64-linux-gnu \
            core/nfc-page-v2/build/ci-aarch64/test_nfc_page_v2
          make -j1 -B -C media/file-nand-v2 CC=aarch64-linux-gnu-gcc \
            BUILD_DIR=build/ci-aarch64 FWLAB_MEDIA_EXCLUSIVE=0 all
          qemu-aarch64 -L /usr/aarch64-linux-gnu \
            media/file-nand-v2/build/ci-aarch64/physical_nand_test
      - name: Check the explicit ARM CRC implementation under emulation
        # Reuse the same oracle, not a new test framework or ARM speed claim.
        run: |
          test "$(id -u)" -ne 0
          make -j1 -C frontends/headless-scale -f ftl.mk \
            CC=aarch64-linux-gnu-gcc BUILD=build/ci-crc-arm64 FWLAB_CRC_NATIVE=0 \
            CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -fno-common -march=armv8-a+crc -DFWLAB_TEST_EXPECT_BACKEND=2' \
            build/ci-crc-arm64/test_crc_fast
          qemu-aarch64 -cpu max -L /usr/aarch64-linux-gnu \
            frontends/headless-scale/build/ci-crc-arm64/test_crc_fast

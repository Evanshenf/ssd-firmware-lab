name: policy-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The policy proves ancestry back to immutable historical sources.
          fetch-depth: 0
          persist-credentials: false
      - name: Run unprivileged repository checks
        run: make check
      - name: Check REUSE 3.3 compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5

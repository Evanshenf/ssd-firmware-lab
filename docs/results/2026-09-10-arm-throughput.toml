# Sanitized transcription of existing records, not a new benchmark run.
# 80 media/NFC transfer samples + 80 FTL phase records; no sample excluded.
# A/B identify baseline/candidate. Runs are in actual AB/BA execution order.
schema_version = 1
export_date = "2026-09-10"
transfer_sample_count = 80
FTL_phase_record_count = 80
process_count = 50
private_archives_publicly_available = false
benchmark_package_publicly_available = false
source_identity_note = "Benchmarks used pre-commit candidate exports. Adopted product-file hashes match measured candidate bytes; later test/README edits do not retroactively change benchmark ELF identity."

[units]
bytes = "bytes; MiB and GiB in prose are binary"
duration = "ns unless an explicit _us or _seconds suffix"
rate = "decimal GB/s; one byte/ns equals one decimal GB/s"
process_elapsed_hms = "GNU time rounded whole-process wall time, not transfer/service denominator"
process_max_rss_KiB = "GNU time process maximum RSS; excludes separate tmpfs file allocation"
FTL_counters = "requests/operations/calls; host_read and host_write are payload bytes; read_bytes and write_bytes are substrate bytes"
FTL_roots_ns = "zero with D167_PROBE=0; not proof that product work had zero cost"
auxiliary_times = "separately timed lifecycle/erase/setup intervals; not throughput samples and not all mutually additive"

[shared_scope]
architecture = "aarch64"
os = "Ubuntu 26.04"
kernel = "7.0.0-30-generic"
compiler = "gcc (Ubuntu 15.2.0-16ubuntu1) 15.2.0"
system_page_bytes = 4096
pinned_cpu = 7
medium = "local tmpfs; mapped physical-v2 runtime; ordinary POSIX format/recovery"
tmpfs_limit_bytes = 1073741824
media_exclusive_build = 1
CRC_backend = "2: compile-time ARM CRC32; native ISA selection"
progress = "one caller-serialized software executor"
sync_CRC_NAND = "retained"
samples_removed = 0
remeasurements_for_export = 0
not_proven = ["native NVMe throughput", "whole-system single CPU", "disk persistence", "host power-loss recovery", "calibrated NAND timing", "PCIe 4/5 saturation", "10 GB/s end-to-end", "1-3% overhead"]

[[campaigns]]
id = "media-intent"
layer = "physical NAND v2 only; NFC linked but not executed; no FTL"
baseline_product_commit = "fc303a2567d49e85665056e969cf9f4284d07809"
adopted_product_commit = "f27b590b4c7312f6b2de08e79b0b9b85f477e6e4"
measured_product_file = "media/file-nand-v2/physical_nand.c"
A_product_file_sha256 = "8fc0bd8ac1d91a03b5a12020c8e3e54c0c64bd94281e756d9ec98a7f78150240"
B_product_file_sha256 = "c04b941ae5f53249f02a1571756bf63795d2ce8f96d6474be4417e7c68644b37"
A_executable_sha256 = "1232a8e43fcb9350d1310cf2587d60989046e60cfde163990823a57fde2ace75"
B_executable_sha256 = "7179057d832d6bfd5f9fe19fe20b7627bab5741fb9d40017f08e7231fb5d387e"
benchmark_source_sha256 = "527c926d8a4bc70e9563b4f1a9a57d8e8d805766f2b2c877b40e66bac7898497"
private_runner_sha256 = "6725c21ba555db92de1babafd8b172e84bb43c1e484d883082c769279a80189d"
private_source_archive_sha256 = "2f81e1d0cc905ccfe0952ac419f2218253634a052caafd01fcc41509be14ceb3"

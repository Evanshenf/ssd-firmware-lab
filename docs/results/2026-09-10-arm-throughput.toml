build_flags = ["-std=c11", "-O2", "-g", "-Wall", "-Wextra", "-Werror", "-Wpedantic", "-fno-common", "-march=native", "-DFWLAB_MEDIA_EXCLUSIVE=1"]
main_working_set_bytes = 134217728
main_bytes_per_sample = 134217728
physical_image_bytes = 142655488
interval = "main_bytes / elapsed_ns; decimal GB/s for timed PROGRAM or READ only"
criterion = "8-KiB Write paired median >= 1.05 and at least 4 wins; every other paired median >= 0.97"
read_control = "Read implementation unchanged; read differences are controls, not caused speedups"
disposition = "adopted after separate correctness/source confirmation; one set, no dropped sample"
run_count = 20
sample_count = 40


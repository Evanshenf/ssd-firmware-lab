# This intentionally overrides the cloud-image default while preserving both
# recovery consoles. The '$' is escaped for the shell that sources this file.
GRUB_CMDLINE_LINUX_DEFAULT="console=tty1 console=ttyS0 memmap=16M\$0x70000000"

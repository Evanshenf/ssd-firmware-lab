[model]
schema_version = 1
profile_id = "C42A-P1"
model_id = "build"
root_node_id = "workflow"

[[nodes]]
id = "workflow"
node_type = "runner"
binding_kind = "exact_repository"
repository_path = ".github/workflows/c4-portable.yml"
execution_mode = "direct"
child_ids = ["authoritative_runner", "claim_validator"]
claim_ids = ["C42A-BUILD-AUTHORITY"]
additional_lane_ids = ["architecture_native"]

[[nodes]]
id = "authoritative_runner"
node_type = "runner"
binding_kind = "exact_repository"
repository_path = "scripts/run_c42_gate.py"
execution_mode = "direct"

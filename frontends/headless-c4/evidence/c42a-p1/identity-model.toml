case_id = "lifecycle_guard"
claim_ids = ["C42A-STRUCTURAL-INVENTORY", "C42A-OBSERVER-EXACT"]
additional_lane_ids = ["phase_gcc", "phase_clang", "replay_gcc", "replay_clang"]


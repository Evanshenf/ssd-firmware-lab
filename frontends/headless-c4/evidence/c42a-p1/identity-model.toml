[model]
schema_version = 1
profile_id = "C42A-P1"
model_id = "identity"

[[record_rules]]
id = "identity_record_contracts"
records = ["operation_token", "observer_slot", "observer_queue", "observer_command", "observer_publication", "observer_reconcile", "observer_notification", "observer_candidate", "observer_control", "observer_target", "observer_root"]
default_rule = "exact"

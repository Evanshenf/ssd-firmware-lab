  "raw SQ capture and queue/CQ identity",
  "command and memory provider contracts",
  "CQ phase-last publication and consume reconciliation",
  "logical notification",
  "reset and teardown exported-step progress",
  "source-bound build and checker authority",
]
excluded = [
  "PCI configuration and BAR/MMIO",
  "DMA and MSI-X",
  "QEMU, VFIO and vfio-user",
  "same-instance concurrency and weak-memory schedules",
  "NAND, NFC, FTL and raw media",
  "power-loss media recovery",
  "physical SSD transport",
  "performance and hardware timing",
]

[authority_assumptions]
digest = "SHA-256 collision resistance"
compiler = "observed GCC and Clang behavior"
runtime = "observed Linux process, filesystem and emulator behavior"
isolation = "runner rejects undeclared repository-controlled verdict inputs"

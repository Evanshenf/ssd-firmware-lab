[model]
schema_version = 1
profile_id = "C42A-P1"
model_id = "provider"

[[record_rules]]
id = "provider_record_contracts"
records = ["nvme_origin_token", "nvme_command_handle", "nvme_command", "command_prepare_key", "command_prepared_token", "command_admission_key", "command_ticket", "command_ready_event", "command_completion_lease", "command_consume_token", "memory_capability", "memory_token", "provider_event"]
default_rule = "exact"
reserved_rule = "required_zero"
case_id = "all"
claim_ids = ["C42A-STRUCTURAL-INVENTORY", "C42A-PROVIDER-INPUT-EXACT", "C42A-PROVIDER-OUTPUT-EXACT"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[record_rules]]
id = "provider_result_contracts"
records = ["nvme_completion_intent", "command_prepare_result", "command_ticket", "command_ready_event", "command_completion_lease", "command_consume_token"]
cases = [
  { id = "success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "failure", default_rule = "preserve", reserved_rule = "preserve" },
]
claim_ids = ["C42A-STRUCTURAL-INVENTORY", "C42A-PROVIDER-OUTPUT-EXACT"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[record_rules]]
id = "provider_memory_status_contracts"
records = ["memory_status"]
entrypoint_ids = ["memory_scrub_start", "memory_scrub_query", "memory_scrub_abort", "memory_scrub_retire_start", "memory_scrub_retire_query", "memory_body_start", "memory_body_query", "memory_marker_start", "memory_marker_query"]
outcome_ids = ["success", "in_progress", "failure"]
cases = [
  { id = "scrub_start_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "scrub_start_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_start_failure", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_query_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "scrub_query_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_query_failure", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_abort_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "scrub_abort_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_abort_failure", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_retire_start_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "scrub_retire_start_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_retire_start_failure", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_retire_query_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "scrub_retire_query_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "scrub_retire_query_failure", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "body_start_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "body_start_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "body_start_failure", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "body_query_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "body_query_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "body_query_failure", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "marker_start_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "marker_start_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "marker_start_failure", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "marker_query_success", default_rule = "conditional", reserved_rule = "required_zero" },
  { id = "marker_query_in_progress", default_rule = "preserve", reserved_rule = "preserve" },
  { id = "marker_query_failure", default_rule = "preserve", reserved_rule = "preserve" },
]
claim_ids = ["C42A-STRUCTURAL-INVENTORY", "C42A-PROVIDER-OUTPUT-EXACT"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[field_overrides]]
id = "memory_status_success_token_exact"
record_rule_id = "provider_memory_status_contracts"
field_ids = ["memory_status.token"]
case_ids = ["scrub_start_success", "scrub_query_success", "scrub_abort_success", "scrub_retire_start_success", "scrub_retire_query_success", "body_start_success", "body_query_success", "marker_start_success", "marker_query_success"]
rule = "exact"

[[field_overrides]]
id = "prepare_result_identity_exact"
record_rule_id = "provider_result_contracts"
field_ids = ["command_prepare_result.version", "command_prepare_result.size"]
case_ids = ["success"]
rule = "exact"

[[field_overrides]]
id = "completion_intent_identity_exact"
record_rule_id = "provider_result_contracts"
field_ids = ["nvme_completion_intent.version", "nvme_completion_intent.size", "nvme_completion_intent.handle", "nvme_completion_intent.origin"]
case_ids = ["success"]
rule = "exact"

[[entrypoint_rules]]
id = "provider_command_entrypoints"
provider = "command"
selector = "all"
claim_ids = ["C42A-PROVIDER-INPUT-EXACT", "C42A-PROVIDER-OUTPUT-EXACT", "C42A-PROVIDER-EFFECT-ORDER"]
positive_witness_id = "witness_provider"
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[entrypoint_rules]]
id = "provider_memory_entrypoints"
provider = "memory"
selector = "all"
claim_ids = ["C42A-PROVIDER-INPUT-EXACT", "C42A-PROVIDER-OUTPUT-EXACT", "C42A-PROVIDER-EFFECT-ORDER"]
positive_witness_id = "witness_provider"
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[scalar_rules]]
id = "provider_scalar_contracts"
direction = "input"
selector = "all"
rule = "exact"
case_id = "all"
claim_ids = ["C42A-PROVIDER-INPUT-EXACT"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[scalar_rules]]
id = "provider_scalar_outputs"
direction = "output"
selector = "all"
cases = [
  { id = "success", rule = "conditional" },
  { id = "in_progress", rule = "preserve" },
  { id = "failure", rule = "preserve" },
]
claim_ids = ["C42A-PROVIDER-OUTPUT-EXACT"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[scalar_overrides]]
id = "provider_in_progress_state_outputs"
scalar_ids = ["command_admit_start.output.admission_state", "command_admit_query.output.admission_state", "command_consume_commit.output.consume_state", "command_consume_query.output.consume_state"]
case_ids = ["in_progress"]
rule = "conditional"

[[relations]]
id = "relation_fresh_admit_generation"
law_id = "provider.fresh_admit_generation"
owner_model = "provider"
kind = "equal"
left = "command_prepare_key.client_generation"
right = "command_admission_key.generation"
scope = "prepared_record_lifetime"
claim_ids = ["C42A-PROVIDER-INPUT-EXACT"]
positive_witness_id = "witness_provider"
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[relations]]
id = "relation_poll_sequence"
law_id = "provider.poll_ready_sequence"
owner_model = "provider"
kind = "strictly_monotonic"
left = "provider_record.ready_sequence"
right = "command_ready_event.sequence"
scope = "provider_instance_controller_epoch"
claim_ids = ["C42A-PROVIDER-OUTPUT-EXACT"]
positive_witness_id = "witness_provider"
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[relations]]
id = "relation_scrub_key"
law_id = "provider.scrub_key_stable"
owner_model = "provider"
kind = "equal"
left = "scrub_start.cap_depth_inverse_phase_token"
right = "scrub_query.cap_depth_inverse_phase_token"
scope = "memory_operation_lifetime"
claim_ids = ["C42A-PROVIDER-INPUT-EXACT"]
positive_witness_id = "witness_provider"
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[relations]]
id = "relation_body_key"
law_id = "provider.body_key_stable"
owner_model = "provider"
kind = "equal"
left = "body_start.cap_slot_expected_16_token"
right = "body_query.cap_slot_expected_16_token"
scope = "memory_operation_lifetime"
claim_ids = ["C42A-PROVIDER-INPUT-EXACT"]
positive_witness_id = "witness_provider"
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[effects]]
id = "effect_command"
kind = "committed"
provider = "command"
claim_ids = ["C42A-PROVIDER-EFFECT-ORDER"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[effects]]
id = "effect_memory"
kind = "committed"
provider = "memory"
claim_ids = ["C42A-PROVIDER-EFFECT-ORDER"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[response_orders]]
id = "response_returned"
kind = "returned"
claim_ids = ["C42A-PROVIDER-EFFECT-ORDER"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[response_orders]]
id = "response_lost_before"
kind = "lost_before_effect"
claim_ids = ["C42A-PROVIDER-EFFECT-ORDER"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[[response_orders]]
id = "response_lost_after"
kind = "lost_after_effect"
claim_ids = ["C42A-PROVIDER-EFFECT-ORDER"]
additional_lane_ids = ["provider_gcc", "provider_clang"]

[layer_fakes]
roots = ["core", "nfc", "media", "frontends"]
target = "fake-link"
output_variable = "FWLAB_FAKE_OUTPUT"
source_extensions = [".asm", ".c", ".cc", ".cpp", ".cxx", ".s"]
ignored_directories = ["build", "fakes", "out", "tests"]
require_elf = true
run_output = true

[provenance]
manifest = "docs/provenance/sources.yaml"
moving_revisions_for_code = false
raw_model_transcripts = false
third_party_submodules = false
